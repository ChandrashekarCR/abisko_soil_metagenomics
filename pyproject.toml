[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abisko"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pandas>=1.3",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
]

all = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "build>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]